# ============================================================================================
# ПРАВИЛО ПОПОЛНЕНИЯ СЛОВАРЯ (не подгонять под генератор)
# Добавляем только формулировки, которые встречаются в РЕАЛЬНЫХ ВОР и сметах
# (docs/real_templates_findings.md и другие публичные тендерные файлы), а не названия из
# scripts/generate_synthetic.py. Иначе результат evaluate.py на синтетике будет подогнанным
# (docs/synthetic_spec.md §8).
# Каждое добавление сопровождается комментарием «откуда»: файл или источник, где формулировка
# встречается (пример: «# откуда: findings §2, ВОР заказчика N»).
# Записи, составленные до введения этого правила, помечены «источник не подтверждён» (в findings из пар
# подтверждена только пометка «/прим/»). Не удаляем, а возвращаемся к ним до 07.10 (до питч-дека):
# орфографические варианты («шпаклевка/шпатлевка») подтверждаются любым реальным ВОР или сметой; для
# остальных проверить по цифрам evaluate.py, что меняется без них (docs/synthetic_spec.md §8).
# ============================================================================================

# Словарь для матчинга названий работ. Применяется перед rapidfuzz, чтобы «разборка» и «демонтаж» не
# считались разными словами. Спорные пары, которые остаются после словаря, идут в LLM (если он доступен).
#
# Порядок обработки названия:
#   1) lower(), «ё» -> «е», удалить strip_markers;
#   2) token_rewrites (диаметры, марки арматуры);
#   3) abbreviations и synonyms: слова заменяются на каноническое;
#   4) grade_equivalents: марка бетона М приводится к классу В;
#   5) rapidfuzz по оставшимся токенам.
#
# Слова «монтаж», «установка», «устройство» НЕ удаляем как стоп-слова. Иначе строка работы
# («Монтаж радиаторов») и строка материала («Радиаторы биметаллические») станут одинаковыми и сольются.

strip_markers: ["/прим/"]               # откуда: docs/real_templates_findings.md, раздел 2 («/прим/» в названиях)

synonyms:                                 # каноническое слово: варианты
  демонтаж: [разборка, демонтирование]   # откуда: источник не подтверждён (вернуться до 07.10)
  монтаж: [установка, устройство]   # откуда: источник не подтверждён (вернуться до 07.10)
  шпаклевка: [шпатлевка, шпаклевание, шпатлевание]   # откуда: источник не подтверждён (вернуться до 07.10)
  окраска: [покраска]   # откуда: источник не подтверждён (вернуться до 07.10)
  профнастил: [профлист, профилированный лист]   # откуда: источник не подтверждён (вернуться до 07.10)
  газобетонный: [газоблок, газобетон]   # откуда: источник не подтверждён (вернуться до 07.10)
  светодиодный: [led]   # откуда: источник не подтверждён (вернуться до 07.10)
  ппр: [ppr, полипропиленовый]   # откуда: источник не подтверждён (вернуться до 07.10)
  пвх: [pvc]   # откуда: источник не подтверждён (вернуться до 07.10)
  кирпичный: [из кирпича]   # откуда: источник не подтверждён (вернуться до 07.10)
  оштукатуривание: [штукатурка]   # откуда: источник не подтверждён (вернуться до 07.10)
  выемка: [разработка]   # откуда: источник не подтверждён (вернуться до 07.10)

abbreviations:                            # сокращение -> полная форма
  "в/э": водоэмульсионный   # откуда: источник не подтверждён (вернуться до 07.10)
  "вд": водоэмульсионный   # откуда: источник не подтверждён (вернуться до 07.10)
  "ц/п": цементно-песчаный   # откуда: источник не подтверждён (вернуться до 07.10)
  "цпр": цементно-песчаный   # откуда: источник не подтверждён (вернуться до 07.10)
  "цпс": цементно-песчаный   # откуда: источник не подтверждён (вернуться до 07.10)
  "арм.": арматура   # откуда: источник не подтверждён (вернуться до 07.10)
  "обл.": облицовка   # откуда: источник не подтверждён (вернуться до 07.10)
  "перекр.": перекрытия   # откуда: источник не подтверждён (вернуться до 07.10)
  "кл.": класс   # откуда: источник не подтверждён (вернуться до 07.10)
  "тяж.": тяжелый   # откуда: источник не подтверждён (вернуться до 07.10)

# Перед сравнением диаметры и марки арматуры приводятся к одному виду:
# «ф12», «Ø12», «d12», «диаметр 12» -> d12; «А-500С», «А-500» -> а500; «А-I» -> а240.
# откуда: источник не подтверждён (вернуться до 07.10)
token_rewrites:
  - ['(?:ø|ф|d|диаметр)\s*(\d+)', 'd\1']
  - ['а-?500с?', 'а500']
  - ['а-?240', 'а240']
  - ['а-?i\b', 'а240']
  - ['(?<![а-я])м-?\s?(\d{3})', 'м\1']
  - ['(?<![а-я])в-?\s?(\d{1,2}(?:[.,]\d)?)', 'в\1']

# Приблизительное соответствие марок бетона (М) и классов (В) по справочным таблицам, проверить перед питчем.
# М300 ~ В22,5, но В25 ~ М350: это разные марки, они не должны сопоставляться.
# откуда: источник не подтверждён (вернуться до 07.10)
grade_equivalents:
  м100: в7.5
  м150: в10
  м200: в15
  м250: в20
  м300: в22.5
  м350: в25
  м400: в30

# Токены, которые обязаны совпасть у обеих строк пары. Если у одной строки есть токен из этой группы,
# а у другой он другой, пара не сопоставляется, сколько бы ни был высокий rapidfuzz-score.
# Пример: «Арматура А500 d12» и «Арматура А240 d8» - разные позиции, хотя названия почти одинаковые.
# откуда: источник не подтверждён (вернуться до 07.10)
must_match_tokens:
  - 'd\d+'                                # диаметр
  - 'а\d{3}'                              # класс арматуры
  - 'в\d{1,2}(?:\.\d)?'                   # класс бетона
  - 'м\d{3}'                              # марка бетона, если не удалось привести к классу
