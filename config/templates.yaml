# Маппинг колонок для каждого шаблона документа.
# Подробности о том, как выглядят реальные файлы: docs/real_templates_findings.md (раздел 2).
# Описание синтетических файлов: docs/synthetic_spec.md.
#
# header_keywords — слова, по которым ищется строка заголовков. Ищем первую строку, где есть ВСЕ слова
#   (шапка «Стройка / Объект / Утверждаю» стоит над таблицей).
# columns: единое имя поля -> варианты названия колонки в файле.
#   Поля seq, formula_raw, drawing_ref есть только в staging, в таблицу items не попадают.
# skip_row_keywords — строки, где встретилось любое из слов, пропускаем (итоги, подписи).
# skip_row_patterns — регулярные выражения для служебных строк.
# section_row_rule — как опознать строку раздела: нет единицы и нет количества. Такая строка не позиция.
templates:
  vor_a:                                  # каркас А: № п.п | Наименование работ и затрат | Ед. изм. | Кол-во | Формула
    doc_type: vor
    header_keywords: ["наименование работ и затрат", "ед. изм", "кол-во"]
    columns:
      seq: ["№ п.п"]
      work_name_raw: ["Наименование работ и затрат"]
      unit_raw: ["Ед. изм."]
      quantity: ["Кол-во"]
      formula_raw: ["Формула расчёта объёма"]
    skip_row_keywords: ["итого", "всего", "составил", "утверждаю"]
    skip_row_patterns: ['^\s*\d(\s+\d){2,}\s*$']      # строка номеров колонок «1 2 3 4 5»
    section_row_rule: empty_unit_and_quantity          # «Раздел 1. …» и подзаголовки без номера
    strip_name_markers: ["/прим/"]

  vor_b:                                  # каркас Б: № в ЛСР | Наименование работ | Ед. изм. | Кол-во | Ссылка на чертежи | Формула
    doc_type: vor
    header_keywords: ["№ в лср", "наименование работ", "ссылка на чертежи"]
    columns:
      seq: ["№ в ЛСР"]
      work_name_raw: ["Наименование работ"]
      unit_raw: ["Ед. изм."]
      quantity: ["Кол-во"]
      drawing_ref: ["Ссылка на чертежи, спецификации"]
      formula_raw: ["Формула расчёта, расчёт объёмов работ и расхода материалов"]
    drop_duplicate_adjacent_columns: true   # заголовок и текст повторяются в соседней колонке
    skip_row_keywords: ["итого", "всего", "составил", "утверждаю"]
    skip_row_patterns: ['^\s*\d(\s+\d){2,}\s*$']
    section_row_rule: empty_unit_and_quantity          # разделы ЗАГЛАВНЫМИ БУКВАМИ
    strip_name_markers: ["/прим/"]
    # «Строительный мусор» повторяется много раз с разными количествами: это один ключ, не дубли.
    # Строки с одинаковым ключом внутри документа суммируются; дубль = полное совпадение строки.

  estimate_a:                             # локальная смета «по мотивам» формы 4, цены за единицу, текущие цены
    doc_type: estimate
    header_keywords: ["шифр", "наименование", "стоимость единицы"]
    columns:
      seq: ["№ поз."]
      norm_code: ["Шифр норматива"]
      work_name_raw: ["Наименование"]
      unit_raw: ["Ед. изм."]
      quantity: ["Кол-во"]
      unit_price: ["Стоимость единицы, сом"]
      amount: ["Общая стоимость, сом"]
    skip_row_keywords: ["итого", "всего", "составил"]
    section_row_rule: empty_unit_and_quantity
    # Цена указана за единицу нормы («100 шт.» -> 170 000), делится на множитель при нормализации.

  contract_a:                             # договор: одна дата и одна сумма, цен за единицу нет
    doc_type: contract
    layout: key_value                     # пары «название поля — значение» вместо таблицы
    fields:
      deadline: ["Срок выполнения работ до"]
      total_amount: ["Цена договора, сом"]
    # Попадает в items одной строкой: work_name_raw = «Договор», doc_date = deadline, amount = total_amount.

  act_a:                                  # синтетический, «по мотивам КС-2»
    doc_type: act
    header_keywords: ["наименование", "выполнено", "ед"]
    columns:
      work_name_raw: ["Наименование выполненных работ"]
      unit_raw: ["Ед."]
      quantity: ["Выполнено"]
      unit_price: ["Цена"]
      amount: ["Сумма"]
    doc_date_regex: 'от\s+(\d{2}\.\d{2}\.\d{4})'   # дата берётся из заголовка «Акт № N от ДД.ММ.ГГГГ»
    skip_row_keywords: ["итого", "всего", "сдал", "принял"]

  act_b:                                  # синтетический, «по мотивам КС-2»
    doc_type: act
    header_keywords: ["работа", "кол-во", "тариф"]
    columns:
      work_name_raw: ["Работа"]
      unit_raw: ["Изм."]
      quantity: ["Кол-во факт"]
      unit_price: ["Тариф"]
      amount: ["Итого по строке"]
    doc_date_regex: 'от\s+(\d{2}\.\d{2}\.\d{4})'
    skip_row_keywords: ["итого по акту", "всего", "сдал", "принял"]

# Каркас В (PDF из программы для смет, с колонкой «Шифр норматива» в ВОР) в MVP не делаем: это PDF, следующая версия.
