# Нормализация единиц измерения: каноническое имя -> варианты написания.
# Сравнение идёт после lower() и удаления пробелов и точек.
units:
  m3: ["м3", "м³", "куб.м", "куб м", "кубм", "куб.метр", "м.куб"]
  m2: ["м2", "м²", "кв.м", "кв м", "квм", "кв.метр", "м.кв"]
  m: ["м", "пог.м", "п.м", "м.п", "погм", "метр"]
  t: ["т", "тонна", "тн", "тонн"]
  kg: ["кг", "килограмм"]
  pcs: ["шт", "шт.", "штука", "штук"]
  set: ["компл", "компл.", "комплект"]
  l: ["л", "литр"]
  point: ["точка", "точ"]
  lump_sum: ["усл", "услуга", "ед", "лот"]
