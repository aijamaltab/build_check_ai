# Нормализация единиц измерения: каноническое имя -> варианты написания.
# Сравнение идёт после lower() и удаления пробелов и точек. Те же преобразования применяются
# и к вариантам из этого файла, и к значению из документа.
units:
  m3: ["м3", "м³", "куб.м", "куб м", "кубм", "куб.метр", "м.куб"]
  m2: ["м2", "м²", "кв.м", "кв м", "квм", "кв.метр", "м.кв"]
  m: ["м", "пог.м", "п.м", "м.п", "погм", "метр"]
  t: ["т", "тонна", "тн", "тонн"]
  kg: ["кг", "килограмм"]
  pcs: ["шт", "шт.", "штука", "штук"]
  set: ["компл", "компл.", "комплект"]
  l: ["л", "литр"]
  point: ["точка", "точ"]
  day: ["сутки", "сут"]
  lump_sum: ["усл", "услуга", "ед", "лот"]

# Единицы-существительные: считаются штуками. Встречаются в реальных ВОР («кран», «бак»).
# Строка с такой единицей получает kind=material (см. templates.yaml, material_markers, и docs/synthetic_spec.md §6).
# Со множителем тоже работают: «100 коробок», «100 приборов» -> pcs, множитель 100.
noun_units:
  pcs: ["кран", "бак", "светильник", "радиатор", "задвижка", "дверь", "коробок", "приборов"]

# Множитель нормы. В реальных ВОР количество указано в единицах нормы:
# «100 м2» и количество 0,06 означает 6 м2.
# Порядок разбора строки с единицей:
#   1) отделить множитель в начале строки по pattern -> factor (если его нет, factor = 1);
#   2) остаток разобрать как единицу из units / noun_units (самое длинное совпадение с начала);
#   3) то, что осталось после единицы, должно быть в qualifiers, иначе единица считается неизвестной (dq).
# Применение: quantity_norm = quantity * factor; unit_price_norm = unit_price / factor.
multiplier:
  pattern: '^\s*(\d+(?:[.,]\d+)?)\s*(.+)$'
  # Допустимые множители. Другие числа перед единицей считаются ошибкой разбора, а не множителем.
  allowed_factors: [1, 10, 100, 1000]

# Уточнения после единицы, которые отбрасываются: «100 м трубопровода» -> m, ×100.
qualifiers:
  - "трубопровода"
  - "груза"
  - "конструкций"
  - "бетона в деле"
  - "окрашиваемой поверхности"
