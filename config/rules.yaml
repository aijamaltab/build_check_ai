# Пороги проверок. Меняем здесь, а не в коде.
volume_exceeded:
  tolerance_pct: 5        # допуск превышения накопительного объёма по актам над ВОР
  high_pct: 20            # выше этого — severity high
  # Для актов, где сумма первична (шаблон с price_is_formula), это дописывается в explanation:
  explanation_if_price_is_formula: "количество могло быть выведено из суммы"

price_increase:
  tolerance_pct: 3        # допуск роста цены в акте относительно сметы
  high_pct: 15            # сравниваем цену за единицу после нормализации (цена за «100 шт.» делится на 100)
  # В договоре цен за единицу нет (только общая сумма), поэтому базой сравнения служит смета.
  # Смета одна и в текущих ценах, пересчёт базисных цен в MVP не делаем.
  # Цена по ключу = сумма / количество по всем строкам ключа в документе (средневзвешенная), а не цена строки.
  price_basis: weighted_by_key
  formula_price_note: "цена получена формулой сумма/количество"   # дописывается в explanation

late_act:
  grace_days: 0           # допустимая задержка после срока договора
  severity: medium

# Расхождения (docs/synthetic_spec.md §6, §7). Все тексты и пороги здесь, числа в тексты подставляет код (LLM чисел не считает).
issues:
  # Severity объёма и цены: delta_pct не ниже high_pct блока проверки -> high, иначе medium.
  severity_default: medium
  missing_in_vor:
    severity_confirmed: high       # ИИ (RowMatcher) уверенно ответил «в ВОР такой работы нет»
    severity_unconfirmed: low      # режим rules_only или ИИ не спрашивали: низкая уверенность
    low_confidence_note: "Без ИИ, низкая уверенность, требует проверки."
    confirmed_note: "ИИ не нашёл пару среди всех позиций ВОР."
  unit_labels: {m3: "м3", m2: "м2", m: "м", t: "т", kg: "кг", pcs: "шт.", set: "компл.", l: "л", point: "точка", day: "сутки", lump_sum: "усл."}
  no_estimate_price_note: "нет цены в смете"     # impact_som пустой, строка помечается
  currency_mismatch_note: "валюты не совпадают, проверка цены не выполнена"
  # Шаблоны explanation. Формулировки только «возможное расхождение» и «требует проверки».
  explanations:
    volume_exceeded: "Возможное расхождение: накопительный объём по актам {actual} {unit} при плане по ВОР {expected} {unit} (больше на {delta_pct} %, допуск {tolerance} %). Требует проверки."
    price_increase: "Возможное расхождение: цена в акте {actual} за {unit} при цене в смете {expected} (выше на {delta_pct} %, допуск {tolerance} %). Требует проверки."
    missing_in_vor: "Возможное расхождение: позиция «{name}» есть в акте ({actual} {unit}), но в ВОР пары не найдено. Требует проверки."
    late_act: "Возможное расхождение: акт датирован {actual_date}, срок договора {expected_date}, позже срока на {days} дн. Требует проверки."
    other_rows: "Другие строки позиции в документе: {rows}."
  # Предупреждение в режиме rules_only: строки без пары не попали в факт, светофор позиций ориентировочный.
  rules_only_status_caveat: "Без ИИ светофор ориентировочный: {a} строк требуют проверки и не учтены в факте позиций, часть позиций может быть показана неверно."
  # Сводка прогона (run_pipeline): строка для интерфейса и питча.
  summary_run_template: "Проверено {n} позиций, не распознано {m}, не сопоставлено {k}, из них требует проверки {a}, не сопоставимо {l}; расхождений {z}; возможное влияние на бюджет {impact} сом; режим {mode}"

matching:
  fuzzy_threshold: 90     # по умолчанию; score >= порога — «та же работа» без LLM. evaluate.py прогоняет 85 и 90 (evaluate.thresholds), выбор по цифрам
  llm_lower_bound: 60     # между lower_bound и threshold (60..90) — спорная пара (для LLM)
  # Словарь синонимов и регулярные обязательные токены (диаметры, марки): config/synonyms.yaml
  # Обязательные токены: ЕДИНСТВЕННЫЙ источник (в synonyms.yaml только комментарий-ссылка).
  # Пара без LLM не сливается, если эти токены у строк различаются (docs/synthetic_spec.md, §6).
  must_match_tokens:
    patterns:                                         # регулярные токены; откуда: источник не подтверждён (вернуться до 07.10)
      - 'd\d+'                                        # диаметр
      - 'а\d{3}'                                      # класс арматуры
      - 'в\d{1,2}(?:\.\d)?'                           # класс бетона
      - 'м\d{3}'                                      # марка бетона, если не удалось привести к классу
    exclusive_word_groups: [[внутренн, наружн]]       # основы слов (род и падеж не важны): у обеих строк одно и то же слово группы
    bracket_text: must_equal                          # текст в скобках должен совпадать
    # Что делать, если слово группы или текст в скобках есть только у одной строки пары:
    #   block: считать конфликтом (буквальное правило); allow: конфликт только когда есть у обеих и различается.
    # Касается patterns (числовые токены), слов группы и скобок. Выбор по цифрам scripts/verify_matching.py.
    missing_side: allow
    # Что ИИ-судья не может обойти: ключи этого блока. Остальные конфликты (слова группы, скобки) решает ИИ.
    llm_veto: [patterns]
  llm_candidates_per_row: 3                           # сколько спорных пар на строку идёт в таблицу кандидатов для LLM
  scorers: [token_set_ratio, token_sort_ratio]
  forbidden_scorers: [WRatio]
  one_to_one: true        # внутри одного документа строка ВОР принимает только один ключ
  # Ключ позиции и kind (docs/synthetic_spec.md §6): kind = material или work.
  work_key_format: "{kind}:{name}|{unit}"
  kind_unknown_default: work
  kind_unknown_dq_check: "kind не определён"   # check_name в dq_checks; это диагностика, не issue

  # Порядок сопоставления строки документа с ВОР (docs/synthetic_spec.md §6, «Строка без пары»):
  # synonyms -> rapidfuzz (порог fuzzy_threshold) -> LLM только для зоны llm_lower_bound..fuzzy_threshold.
  pipeline: [synonyms, rapidfuzz, llm]
  llm_zone: [llm_lower_bound, fuzzy_threshold]      # score >= нижней и < верхней границы (имена параметров выше)
  skip_llm_in_modes: [rules_only]                   # в этих режимах шаг llm пропускается
  rules_only_explanation: "ИИ-режим недоступен, шаг LLM пропущен"   # дописывается в explanation расхождения
  # Нет пары после всех шагов: строка «не сопоставлена». Для строки акта создаётся issue, для сметы нет.
  unmatched_status: "не сопоставлена"
  unmatched_issue:
    document: act
    issue_type: missing_in_vor
  # Три состояния строки документа (docs/synthetic_spec.md §6): matched (пара найдена), ambiguous (пары нет, но есть
  # кандидаты от llm_lower_bound и выше: без LLM не решено), absent (нет ни одного кандидата).
  # Issue missing_in_vor создаётся ТОЛЬКО для absent; ambiguous идёт в сводку и в dq, но не в issues.
  states: [matched, ambiguous, absent]
  unmatched_issue_only_state: absent
  ambiguous_dq_check: "не сопоставлено, требует проверки"      # check_name в dq_checks по документу, диагностика
  summary_with_review_template: "Проверено {n} позиций, не распознано {m}, не сопоставлено {k}, из них требует проверки {a}, не сопоставимо {l}"
  # Правило «подмножество»: если token_set_ratio = 100, а token_sort_ratio ниже этого порога, названия отличаются
  # лишними словами (работа и её материал, «Светильники LED» и «…монтаж»): пара не склеивается автоматически,
  # а идёт в кандидаты для LLM. Применяется в режиме с защитами (synonyms), не в базовой линии no_synonyms.
  subset_review_below: 90     # на данных 80, 85 и 90 дают одинаковые метрики; 90 ловит и пару «Светильники LED» (token_sort 87)
  # Где применять правило «подмножество»: always (всегда, буквально) или competitor (только если у строки есть
  # конкурент другого kind с оценкой от llm_lower_bound: путаница работы и материала). Выбор по цифрам verify_matching.
  subset_review_scope: competitor
  # Сходство названий (docs/synthetic_spec.md §6, «Сходство названий»). plain: токены как есть. stemmed: отсечение окончаний
  # без внешних библиотек и «короткий токен это начало длинного» (сокращения: дверн. и дверных). Стоп-слов нет:
  # «монтаж/устройство» не удаляются (synonyms.yaml), эксперимент показал склейку «монтаж» с «демонтаж».
  name_similarity: stemmed
  stem_min_len: 4                  # основа не короче
  prefix_abbreviation_min_len: 4   # токен короче или равен этой длины и является началом другого токена, считается сокращением
  stem_endings: [ами, ями, ого, его, ому, ему, ыми, ими, ов, ев, ей, ом, ем, ах, ях, ой, ий, ый, ая, яя, ое, ее, ые, ие, ых, их, ую, юю, ам, ям, а, я, у, ю, ы, и, е, о, ь]   # общие падежные окончания, не из данных
  # Строка без признака kind (единица «м», «шт»), у которой рядом есть конкурент другого kind (работа и материал):
  # слияние по порогу не делается, пара идёт на проверку (ambiguous), как у правила «подмножество», но для любой оценки.
  competitor_review: true
  # Слова-глаголы, на которых одних нельзя строить кандидата для LLM: если без них сходство падает ниже llm_lower_bound,
  # пара не попадает в кандидаты («Монтаж отмостки…» и «Монтаж опалубки» похожи только словом «монтаж»).
  # В слияние по порогу это не вмешивается, слова не удаляются из названий (synonyms.yaml).
  candidate_ignore_words: [монтаж, демонтаж, устройство, установка, работы]
  summary_template: "Проверено {n} позиций, не распознано {m}, не сопоставлено {k}, не сопоставимо {l}"   # одна строка в сводке интерфейса
  # «не распознано» = парсер не смог прочитать строку; «не сопоставлено» = прочитал, но пары в ВОР нет;
  # «не сопоставимо» = валюты документов не совпали, проверки цены и суммы не выполнены

# Валюта документа (docs/synthetic_spec.md, §6): берётся из заголовка колонки цены; валюты не конвертируем.
currency:
  default: сом                                         # для синтетики, где валюта не указана
  mismatch_policy: skip_price_and_amount_checks        # price_increase и impact_som не выполняются
  mismatch_dq_check: "валюты не совпадают"             # check_name в dq_checks
  mismatch_summary_label: "не сопоставимо"             # в сводке интерфейса
  convert: false

# Формулы в Excel (docs/synthetic_spec.md, §6).
formulas:
  read_mode: data_only                                 # openpyxl data_only=True: кэшированные значения
  missing_value_dq_check: "формула без значения"       # если значения нет (None), строка не считается молча

# ИИ-функции (docs/synthetic_spec.md, раздел «ИИ-функции» §10; CLAUDE.md, раздел 3).
# Принцип: ИИ читает, понимает и объясняет, обычный код считает и проверяет. LLM никогда не считает числа.
# Демо и главные сценарии идут в режиме llm; без ИИ приложение работает в режиме rules_only с баннером.
# Ключ API только из переменной окружения (api_key_env) или secrets хостинга, в репозитории его нет.
llm:
  model: gemini-3.1-flash-lite  # не preview; проверить на сегодняшнюю дату: название модели и её доступность
  temperature: 0
  cache_dir: data/cache/llm    # кэш по хешу запроса (модель + schema_version + текст запроса)
  schema_version: 1            # меняется вместе с форматом JSON-ответа; входит в хеш кэша
  max_retries: 1               # повторы при сбое (сеть, 429, пустой или невалидный JSON), затем «нет ответа» и запасной путь без ИИ
  timeout: 20                  # секунд на запрос; проверить на сегодняшнюю дату вместе с лимитами бесплатного тарифа
  call_pause_seconds: null     # пауза между вызовами, с; null = считать по limits: 60 / rpm * pause_margin; run_llm.py --pause переопределяет
  pause_margin: 1.25           # запас к паузе (для 15 rpm: 60/15 * 1.25 = 5 с)
  fallback_pause_seconds: 5.0  # пауза, если для модели нет строки в limits
  # Лимиты бесплатного тарифа по моделям: rpm (запросов в минуту), rpd (в сутки; null = неизвестен).
  # ПРЕДВАРИТЕЛЬНЫЕ цифры из консоли пользователя на 04.10.2026, не из документации: перепроверять на странице лимитов
  # (https://ai.google.dev/gemini-api/docs/rate-limits, фактические значения в AI Studio), они меняются.
  limits:
    gemini-3.1-flash-lite: {rpm: 15, rpd: 500}
    gemini-2.5-flash: {rpm: 5, rpd: null}
    gemini-2.5-flash-lite: {rpm: 10, rpd: 20}
    gemini-3-flash: {rpm: 5, rpd: 20}
  rpd_warn_fraction: 0.8       # при таком доле суточного лимита (по счётчику вызовов) предупреждение, при 100% прогон останавливается
  usage_file: _usage.json      # служебный файл в cache_dir: вызовы за сутки по моделям, без секретов (не запись кэша)
  retry_pause_seconds: 2.0     # пауза перед повтором; при 429 удваивается с каждой попыткой
  retry_max_pause_seconds: 60.0  # потолок паузы при 429 (и для паузы, которую просит сервер в RetryInfo)
  quota_abort_after: 3         # столько вызовов подряд с ответом 429 (после ожидания) останавливают прогон: новых вызовов нет
  max_calls_per_run: null      # потолок вызовов к API за прогон (null = без потолка); run_llm.py --max-calls
  cache_only: false            # true: только кэш, API не вызывается, ключ не нужен; то же самое переменная окружения cache_only_env
  cache_only_env: LLM_CACHE_ONLY
  cache_dir_env: LLM_CACHE_DIR # необязательная переменная окружения, переопределяет cache_dir (нужна в тестах)
  cache_write: true            # писать ответы в кэш (в кэш идут только названия, единицы и ответы модели, без секретов)
  judge_hard_conflicts: [patterns, words]   # что ответ ИИ-судьи пар не может обойти: числовые токены и слова exclusive_word_groups
                                            # (внутренн/наружн); скобки решает модель. Единица и вид работ проверяются всегда.
  api_key_env: GEMINI_API_KEY  # имя переменной окружения; значение в конфиг не пишем
  modes: [llm, rules_only]     # те же значения, что runs.mode в схеме
  default_mode: llm
  rules_only_banner: "ИИ-режим недоступен, использован базовый режим"   # показывается в интерфейсе в режиме rules_only
  min_confidence: 0.7          # ниже этого ответ «та же работа» не принимается; значение предварительное, подобрать на синтетике
  functions:                   # включённые ИИ-функции (в режиме rules_only все выключены)
    matching: true             # «а»: сопоставление спорных пар (зона matching.llm_zone), PairJudge
    row_matching: true         # «а2»: выбор ключа из всего списка ВОР для строк ambiguous и absent, RowMatcher
    template_reading: true     # «б»: чтение незнакомого шаблона, только если ни один из templates.yaml не подошёл; делается после «а» и «в», если останется время
    explanations: true         # «в»: объяснения красных расхождений, вход только из issues
    report: true               # «в»: итоговый отчёт по проекту, вход только агрегаты из issues
  # Лимиты запросов и стоимость бесплатного тарифа не проверены: проверить на сегодняшнюю дату до деплоя.

# Режимы evaluate.py (docs/synthetic_spec.md §8). Результат на синтетике оптимистичен.
evaluate:
  modes: [no_synonyms, synonyms, synonyms_llm]
  thresholds: [85, 90]       # fuzzy_threshold, который прогоняет evaluate.py; выбор по цифрам (ложные склейки, ложные «не сопоставлено»)
  metrics: [recall, precision, traps, false_unmatched, false_merges]
  # false_unmatched: строки без пары, для которых в ground_truth нет missing_in_vor, по каждому режиму,
  # со списком «файл:лист:строка» (docs/synthetic_spec.md §8).
  false_unmatched_list_fields: [file, sheet, row]

# Светофор по позициям (marts.position_status), описание в docs/synthetic_spec.md.
position_status:
  green_under_tolerance_pct: 5   # факт не ниже плана более чем на 5% -> всё ещё зелёный
  # Верхняя граница зелёного берётся из volume_exceeded.tolerance_pct.

severity_levels: [low, medium, high]

data_quality:
  max_unrecognized_share: 0.2   # файл с большей долей нераспознанных строк помечается
  sum_tolerance_pct: 1          # допуск расхождения суммы строк и итога документа
